# GeoIP Update Configuration Example
# Copy this to config.yaml and customize for your environment

# API Configuration
# Or use the GEOIP_API_KEY environment variable
api_key: "your_api_key_here"
# Replace with the actual endpoint
api_endpoint: "https://api.example.com/v1/auth"

# Download Configuration
# Where to store databases
target_dir: "/var/lib/geoip"
# List specific databases or use "all"
databases:
  - all
  # Or specify individual databases:
  # - GeoIP2-City.mmdb
  # - GeoIP2-Country.mmdb
  # - GeoIP2-ISP.mmdb

# Network Configuration
max_retries: 3
timeout: 1800
# Parallel downloads
max_concurrent: 2
verify_ssl: true

# Change Detection and Locking
# only_changed: download only databases that changed since the last run
# lock_file: exclusive lock shared by every run that uses this path
# lock_timeout: seconds to wait for lock_file
only_changed: false
# lock_file: /var/lib/geoip/.geoip-update.lock
lock_timeout: 1800

# Logging
# Uncomment to enable file logging
# log_file: /var/log/geoip-update.log

# Advanced Options
user_agent: "GeoIP-Update-Python/1.0"